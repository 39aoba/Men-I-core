<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIAGNOSIS | Men I Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; scroll-behavior: smooth; background-color: #FDFDFF; margin: 0; }
        .lucide { stroke-width: 2px; display: inline-block; vertical-align: middle; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.8s ease-out forwards; }

        /* ホバー時のアイコン挙動は共通JSで制御される色クラスに合わせてシンプルに維持 */
        .diagnosis-card:hover .icon-box { transform: scale(1.1) rotate(-5deg); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 共通ナビゲーション（JSで生成） -->
    <nav id="common-navbar"></nav>

    <main class="flex-grow pt-32 pb-24 px-6">
        <div class="max-w-7xl mx-auto space-y-16">
            
            <!-- Header Section -->
            <header class="space-y-6 animate-in">
                <div class="flex items-center gap-2 text-indigo-600 font-bold text-xs tracking-[0.4em] uppercase">
                    <i data-lucide="sparkles" style="width:14px; height:14px;"></i>
                    <span>Know Your Core</span>
                </div>
                <h1 class="text-5xl md:text-7xl font-black text-slate-900 tracking-tighter leading-none uppercase">Diagnosis.</h1>
                <p class="max-w-2xl text-slate-500 font-medium leading-relaxed">
                    今の自分を知ることが、理想の「軸」を作る第一歩。3つの異なる視点からあなたの状態を可視化し、最適な改善案を導き出します。
                </p>
            </header>

            <!-- Diagnosis Grid (JSによって中身が自動生成されます) -->
            <div id="diagnosis-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- components.js の renderDiagnosis() がここにカードを流し込みます -->
            </div>

        </div>
    </main>

    <!-- 共通フッター（JSで生成） -->
    <footer id="common-footer"></footer>

    <!-- 全てのコンポーネントとロジックを管理するJS -->
    <script src="components.js"></script>
</body>
</html>
