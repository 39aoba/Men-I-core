<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STYLE IDENTITY DIAGNOSIS | Men I Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #FDFDFF; color: #1e293b; overflow-x: hidden; }
        .lucide { stroke-width: 2px; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .option-btn:hover { border-color: #f59e0b; background-color: #fffbeb; transform: translateX(8px); }
        .hidden { display: none; }
        .progress-bar { transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav id="common-navbar"></nav>

    <main class="flex-grow pt-32 pb-24 px-6 flex items-center justify-center">
        <div id="diagnosis-app" class="max-w-2xl w-full">
            
            <!-- Question Screen -->
            <div id="question-screen" class="space-y-12">
                <div class="space-y-4">
                    <div class="flex justify-between items-end">
                        <span id="q-category" class="text-[10px] font-black text-amber-600 tracking-[0.3em] uppercase">Category: Visual Strategy</span>
                        <span id="q-step" class="text-[10px] font-black text-slate-300 tracking-widest uppercase">01 / 05</span>
                    </div>
                    <div class="w-full h-1 bg-slate-100 rounded-full overflow-hidden">
                        <div id="progress" class="progress-bar h-full bg-amber-500" style="width: 20%;"></div>
                    </div>
                </div>

                <div class="space-y-8 animate-in" id="question-content">
                    <h2 id="q-text" class="text-2xl md:text-3xl font-black text-slate-900 leading-tight">質問内容</h2>
                    <div id="options-grid" class="grid gap-4">
                        <!-- Options injected by JS -->
                    </div>
                </div>
            </div>

            <!-- Result Screen -->
            <div id="result-screen" class="hidden space-y-12 animate-in text-center">
                <div class="space-y-6">
                    <div class="flex justify-center">
                        <div id="result-icon" class="w-24 h-24 bg-amber-900 rounded-[2.5rem] flex items-center justify-center text-white shadow-2xl">
                            <i data-lucide="shirt" style="width:40px; height:40px;"></i>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <p class="text-[10px] font-black text-amber-600 tracking-[0.4em] uppercase">Your Style Pillar</p>
                        <h2 id="result-title" class="text-4xl font-black text-slate-900 tracking-tighter uppercase">Result Title</h2>
                    </div>
                </div>

                <div class="bg-white p-10 rounded-[3rem] border border-slate-100 shadow-sm space-y-6 text-left">
                    <div class="prose prose-slate">
                        <p id="result-desc" class="text-slate-600 font-medium leading-relaxed">分析結果の詳細テキスト。</p>
                    </div>
                    <div class="pt-6 border-t border-slate-50">
                        <h4 class="text-[10px] font-black text-slate-900 tracking-widest uppercase mb-4">今日から始めるアクションプラン</h4>
                        <ul id="action-list" class="space-y-3 text-sm font-bold text-slate-500">
                            <!-- Action items injected by JS -->
                        </ul>
                    </div>
                </div>

                <div class="space-y-6">
                    <p class="text-[10px] font-black text-slate-400 tracking-widest uppercase italic">Recommended for Style Mastery</p>
                    <div id="recommended-card" class="max-w-sm mx-auto">
                        <!-- Article card injected by JS -->
                    </div>
                </div>

                <div class="pt-8">
                    <button onclick="location.reload()" class="text-[10px] font-black text-slate-300 hover:text-amber-600 transition-colors uppercase tracking-[0.3em] flex items-center gap-2 mx-auto">
                        <i data-lucide="refresh-ccw" class="w-3 h-3"></i>
                        Re-Analyze Style
                    </button>
                </div>
            </div>

        </div>
    </main>

    <footer id="common-footer"></footer>

    <script src="../components.js"></script>
    <script>
        const diagnosisData = {
            questions: [
                {
                    text: "朝、服を選ぶ時の基準として最も近いものは？",
                    category: "Selection Logic",
                    options: [
                        { text: "清潔感があり、周囲に不快感を与えないか", score: { CLASSIC: 2, MINIMAL: 1, CREATIVE: 0 } },
                        { text: "その日の自分の気分をブーストできるか", score: { CLASSIC: 0, MINIMAL: 0, CREATIVE: 2 } },
                        { text: "時短のため、決まった組み合わせを着る", score: { CLASSIC: 1, MINIMAL: 2, CREATIVE: 0 } }
                    ]
                },
                {
                    text: "靴のメンテナンス（汚れ落とし、磨き）の頻度は？",
                    category: "Detail Awareness",
                    options: [
                        { text: "汚れたらその都度、または定期的に行っている", score: { CLASSIC: 2, MINIMAL: 1, CREATIVE: 1 } },
                        { text: "たまに気が向いた時にやる程度", score: { CLASSIC: 0, MINIMAL: 0, CREATIVE: 0 } },
                        { text: "ボロボロになるまで履き潰して買い替える", score: { CLASSIC: 0, MINIMAL: 0, CREATIVE: 0 } }
                    ]
                },
                {
                    text: "美容室に行く頻度や、髪型へのこだわりは？",
                    category: "Grooming Standard",
                    options: [
                        { text: "1ヶ月に1回、シルエットが崩れる前に整える", score: { CLASSIC: 2, MINIMAL: 1, CREATIVE: 1 } },
                        { text: "数ヶ月に1回、伸びてきて邪魔になったら行く", score: { CLASSIC: 0, MINIMAL: 0, CREATIVE: 0 } },
                        { text: "自分の個性を表現するスタイルを追求している", score: { CLASSIC: 0, MINIMAL: 0, CREATIVE: 2 } }
                    ]
                },
                {
                    text: "クローゼットの中にある服の状態は？",
                    category: "Wardrobe Management",
                    options: [
                        { text: "数は多いが、実際に着ているのは一握り", score: { CLASSIC: 1, MINIMAL: 0, CREATIVE: 1 } },
                        { text: "少数精鋭で、すべての服の用途が明確", score: { CLASSIC: 1, MINIMAL: 3, CREATIVE: 0 } },
                        { text: "トレンドに合わせて頻繁に入れ替わっている", score: { CLASSIC: 0, MINIMAL: 0, CREATIVE: 2 } }
                    ]
                },
                {
                    text: "「良い服」と聞いて、あなたが重視するポイントは？",
                    category: "Value Priority",
                    options: [
                        { text: "長く着られる耐久性と、普遍的なデザイン", score: { CLASSIC: 2, MINIMAL: 1, CREATIVE: 0 } },
                        { text: "他にはない独創的なデザインや色使い", score: { CLASSIC: 0, MINIMAL: 0, CREATIVE: 2 } },
                        { text: "肌触りや動きやすさ、機能性の高さ", score: { CLASSIC: 0, MINIMAL: 2, CREATIVE: 0 } }
                    ]
                }
            ],
            results: {
                CLASSIC: {
                    title: "The Standard / 信頼の象徴",
                    icon: "shield-check",
                    desc: "あなたは「誠実さ」や「規律」を装いによって表現できるタイプです。普遍的なスタイルは、初対面の相手に安心感とプロフェッショナルな印象を与えます。今の軸をさらに強固にするには、上質な素材選びと完璧なサイズ感（フィッティング）に投資するのが近道です。",
                    actions: ["シャツのアイロンがけを習慣化", "ジャストサイズのジャケットを新調", "革靴のプロによる磨き体験"],
                    targetCategory: "STYLE"
                },
                MINIMAL: {
                    title: "The Essential / 本質の追求",
                    icon: "layers",
                    desc: "あなたは「無駄を削ぎ落とすこと」に価値を見出す、洗練された軸の持ち主です。選択肢を減らすことで脳のリソースを重要な決断に集中させています。色のトーンを統一し、シルエットの美しさにこだわることで、あなたの静かな自信がより際立ちます。",
                    actions: ["クローゼットの「1年着ていない服」を処分", "自分だけの「制服（ユニフォーム）」を定義", "小物を黒一色に統一してみる"],
                    targetCategory: "STYLE"
                },
                CREATIVE: {
                    title: "The Expressionist / 個性の革新",
                    icon: "palette",
                    desc: "あなたは装いを「自己表現のキャンバス」と捉える、自由な軸を持っています。型にハマらないスタイルは周囲に刺激を与え、あなた自身の創造性を引き出します。トレンドを追うのではなく、自分だけの「物語」があるアイテムを一点取り入れると、表現がより深まります。",
                    actions: ["自分のアイコンとなるアクセサリーを決める", "普段選ばない色のソックスを試す", "ヴィンテージショップで一点物を探す"],
                    targetCategory: "STYLE"
                }
            }
        };

        let currentQ = 0;
        let totalScores = { CLASSIC: 0, MINIMAL: 0, CREATIVE: 0 };

        function init() {
            renderQuestion();
        }

        function renderQuestion() {
            const q = diagnosisData.questions[currentQ];
            const content = document.getElementById('question-content');
            
            document.getElementById('q-category').innerText = `Category: ${q.category}`;
            document.getElementById('q-step').innerText = `${String(currentQ + 1).padStart(2, '0')} / 05`;
            document.getElementById('progress').style.width = `${(currentQ + 1) * 20}%`;
            document.getElementById('q-text').innerText = q.text;

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full p-6 text-left border border-slate-100 rounded-[1.5rem] font-bold text-slate-600 transition-all duration-300 flex justify-between items-center group";
                btn.innerHTML = `<span>${opt.text}</span><i data-lucide="chevron-right" class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-all"></i>`;
                btn.onclick = () => selectOption(opt.score);
                grid.appendChild(btn);
            });

            if (window.lucide) window.lucide.createIcons();
            content.classList.remove('animate-in');
            void content.offsetWidth;
            content.classList.add('animate-in');
        }

        function selectOption(score) {
            for (let key in score) totalScores[key] += score[key];
            currentQ++;
            if (currentQ < diagnosisData.questions.length) {
                renderQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('question-screen').classList.add('hidden');
            const resultScreen = document.getElementById('result-screen');
            resultScreen.classList.remove('hidden');

            const topType = Object.keys(totalScores).reduce((a, b) => totalScores[a] >= totalScores[b] ? a : b);
            const result = diagnosisData.results[topType];

            document.getElementById('result-title').innerText = result.title;
            document.getElementById('result-desc').innerText = result.desc;
            document.getElementById('result-icon').innerHTML = `<i data-lucide="${result.icon}" style="width:40px; height:40px;"></i>`;

            const actionList = document.getElementById('action-list');
            actionList.innerHTML = result.actions.map(a => `<li class="flex items-start gap-3"><i data-lucide="check-circle-2" class="w-4 h-4 text-amber-600 shrink-0"></i><span>${a}</span></li>`).join('');

            const recArticle = components.articles.find(a => a.category === result.targetCategory) || components.articles[0];
            document.getElementById('recommended-card').innerHTML = components.createArticleCard(recArticle);

            if (window.lucide) window.lucide.createIcons();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = init;
    </script>
</body>
</html>
