<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDITORIALS | Men I Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; scroll-behavior: smooth; background-color: #FDFDFF; margin: 0; }
        .lucide { stroke-width: 2px; display: inline-block; vertical-align: middle; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.8s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 共通ナビゲーション (components.jsで挿入) -->
    <nav id="common-navbar"></nav>

    <main class="flex-grow pt-32 pb-24 px-6">
        <div class="max-w-7xl mx-auto space-y-16">
            
            <!-- ページヘッダー -->
            <header class="space-y-6 animate-in">
                <div class="flex items-center gap-2 text-indigo-600 font-bold text-xs tracking-[0.4em] uppercase">
                    <i data-lucide="book-open" style="width:14px; height:14px;"></i>
                    <span>Knowledge & Insight</span>
                </div>
                <h1 class="text-5xl md:text-7xl font-black text-slate-900 tracking-tighter leading-none uppercase">Editorials.</h1>
            </header>

            <!-- カテゴリーフィルタ -->
            <nav class="flex flex-wrap gap-3 animate-in" style="animation-delay: 0.1s;">
                <button onclick="components.filterArticles('ALL')" data-category="ALL" class="category-btn px-8 py-3 rounded-full bg-indigo-600 text-white text-xs font-black tracking-widest transition-all shadow-lg shadow-indigo-600/20">ALL</button>
                <button onclick="components.filterArticles('CORE')" data-category="CORE" class="category-btn px-8 py-3 rounded-full bg-white border border-slate-100 text-xs font-black tracking-widest text-slate-600 hover:border-indigo-600 transition-all">CORE</button>
                <button onclick="components.filterArticles('STYLE')" data-category="STYLE" class="category-btn px-8 py-3 rounded-full bg-white border border-slate-100 text-xs font-black tracking-widest text-slate-600 hover:border-indigo-600 transition-all">STYLE</button>
                <button onclick="components.filterArticles('FOOD')" data-category="FOOD" class="category-btn px-8 py-3 rounded-full bg-white border border-slate-100 text-xs font-black tracking-widest text-slate-600 hover:border-indigo-600 transition-all">FOOD</button>
                <button onclick="components.filterArticles('GUIDE')" data-category="GUIDE" class="category-btn px-8 py-3 rounded-full bg-white border border-slate-100 text-xs font-black tracking-widest text-slate-600 hover:border-indigo-600 transition-all">GUIDE</button>
            </nav>

            <!-- 記事グリッド本体 -->
            <div id="article-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-16 animate-in" style="animation-delay: 0.2s;">
                <!-- JavaScriptにより生成 -->
            </div>

            <!-- もっと見るボタンの器 -->
            <div id="more-button-container" class="mt-20 flex justify-center animate-in" style="animation-delay: 0.3s;">
                <!-- 条件に応じてボタンが表示される -->
            </div>

        </div>
    </main>

    <!-- 共通フッター (components.jsで挿入) -->
    <footer id="common-footer"></footer>

    <!-- 全ページ共通の管理プログラム -->
    <script src="components.js"></script>
</body>
</html>
