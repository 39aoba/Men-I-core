<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIAGNOSIS | Men I Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #FDFDFF; margin: 0; }
        .lucide { stroke-width: 2px; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-up { animation: fadeInUp 0.6s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 共通ヘッダー挿入ポイント -->
    <nav id="common-navbar"></nav>

    <main class="flex-grow pt-32 pb-20 px-6">
        <div class="max-w-4xl mx-auto space-y-12">
            <div class="space-y-4 animate-up">
                <div class="flex items-center gap-2 text-indigo-600 font-bold text-xs tracking-[0.3em] uppercase"><i data-lucide="layout-grid" style="width:14px; height:14px;"></i><span>DIAGNOSTIC</span></div>
                <h1 class="text-4xl md:text-5xl font-bold text-slate-900 tracking-tight leading-tight">「自分」を<span class="text-indigo-600">可視化する</span></h1>
                <p class="text-slate-500 font-medium text-sm leading-relaxed max-w-lg">現在のあなたの状態を分析し、最適な改善ステップを提案します。</p>
            </div>

            <div class="grid gap-6 animate-up" style="animation-delay: 0.1s;">
                <div class="group relative bg-white border border-slate-100 rounded-[2rem] p-8 hover:shadow-2xl hover:shadow-indigo-500/10 transition-all duration-500 cursor-pointer overflow-hidden flex flex-col md:flex-row md:items-center gap-6">
                    <div class="w-16 h-16 bg-white shadow-sm rounded-2xl flex items-center justify-center border border-slate-50 shrink-0 group-hover:scale-110 transition-transform"><i data-lucide="target" class="text-indigo-600" style="width:28px; height:28px;"></i></div>
                    <div class="flex-grow space-y-1">
                        <span class="text-[10px] font-bold text-indigo-600 tracking-widest uppercase">START GUIDE</span>
                        <h2 class="text-xl font-bold text-slate-900 group-hover:text-indigo-600 transition-colors">初心者向け・基本の軸診断</h2>
                        <p class="text-sm text-slate-500 font-medium">まずはここから。今の自分にぴったりの習慣を見つける。</p>
                    </div>
                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-slate-900 text-white group-hover:bg-indigo-600 group-hover:translate-x-1 transition-all shrink-0 self-end md:self-center"><i data-lucide="chevron-right" style="width:20px; height:20px;"></i></div>
                </div>
                
                <div class="group relative bg-white border border-slate-100 rounded-[2rem] p-8 hover:shadow-2xl hover:shadow-indigo-500/10 transition-all duration-500 cursor-pointer overflow-hidden flex flex-col md:flex-row md:items-center gap-6">
                    <div class="w-16 h-16 bg-white shadow-sm rounded-2xl flex items-center justify-center border border-slate-50 shrink-0 group-hover:scale-110 transition-transform"><i data-lucide="sparkles" class="text-blue-600" style="width:28px; height:28px;"></i></div>
                    <div class="flex-grow space-y-1">
                        <span class="text-[10px] font-bold text-indigo-600 tracking-widest uppercase">BEAUTY CARE</span>
                        <h2 class="text-xl font-bold text-slate-900 group-hover:text-indigo-600 transition-colors">清潔感を作るスキンケア診断</h2>
                        <p class="text-sm text-slate-500 font-medium">肌質を分析し、最低限揃えるべきアイテムを厳選。</p>
                    </div>
                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-slate-900 text-white group-hover:bg-indigo-600 group-hover:translate-x-1 transition-all shrink-0 self-end md:self-center"><i data-lucide="chevron-right" style="width:20px; height:20px;"></i></div>
                </div>
            </div>
        </div>
    </main>

    <!-- 共通フッター挿入ポイント -->
    <footer id="common-footer"></footer>

    <!-- 共通コンポーネント読み込み -->
    <script src="components.js"></script>
</body>
</html>
