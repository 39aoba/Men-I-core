<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTICLES | Men I Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #FDFDFF; margin: 0; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-up { animation: fadeInUp 0.6s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- 共通ナビゲーション（components.jsで挿入されます） -->
    <nav id="common-navbar"></nav>

    <main class="flex-grow pt-32 pb-24 px-6">
        <div class="max-w-7xl mx-auto space-y-20">
            <!-- Header Section -->
            <div class="space-y-6 animate-up">
                <div class="flex items-center gap-2 text-indigo-600 font-bold text-xs tracking-[0.4em] uppercase">
                    <i data-lucide="book-open" style="width:14px; height:14px;"></i><span>Knowledge & Insight</span>
                </div>
                <h1 class="text-5xl md:text-7xl font-black text-slate-900 tracking-tighter leading-none">EDITORIALS.</h1>
            </div>

            <!-- 記事リスト挿入ポイント -->
            <!-- components.js の renderArticleList() がここを書き換えます -->
            <div id="article-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-12 animate-up">
                <!-- JavaScriptにより自動生成されます -->
            </div>
        </div>
    </main>

    <!-- 共通フッター（components.jsで挿入されます） -->
    <footer id="common-footer"></footer>

    <!-- 全ページ共通の管理プログラム -->
    <script src="components.js"></script>
</body>
</html>
